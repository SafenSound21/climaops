<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ClimaOps logo">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Mark: minimal rounded square + CO monogram (WhatsApp-friendly) -->
  <rect x="64" y="64" width="384" height="384" rx="128" fill="#0B1220" filter="url(#shadow)"/>

  <text x="256" y="308" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
        font-size="152" font-weight="900" letter-spacing="-6" fill="#FFFFFF">CO</text>
</svg>
