<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="120" y1="50" x2="310" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A66FF"/>
      <stop offset="1" stop-color="#00B894"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="52" font-family="Inter, system-ui, -apple-system" font-size="20" font-weight="700" fill="#0B1220">ClimaOps — logo concepts (SVG)</text>
  <text x="40" y="80" font-family="Inter, system-ui, -apple-system" font-size="14" font-weight="500" fill="#5B667A">Minimal, Apple-like. Works as WhatsApp profile icon + favicon.</text>

  <!-- Concept A: CO monogram on dark rounded square -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="140" height="140" rx="44" fill="#0B1220" filter="url(#shadow)"/>
    <text x="70" y="92" text-anchor="middle" font-family="Inter, system-ui, -apple-system" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-1">CO</text>
    <text x="0" y="178" font-family="Inter, system-ui, -apple-system" font-size="14" font-weight="600" fill="#0B1220">A) Monogram CO</text>
    <text x="0" y="198" font-family="Inter, system-ui, -apple-system" font-size="12" font-weight="500" fill="#5B667A">Simple, legible at 32px</text>
  </g>

  <!-- Concept B: Gradient ring + dot (signal/ops) -->
  <g transform="translate(320,120)">
    <rect x="0" y="0" width="140" height="140" rx="44" fill="#FFFFFF" stroke="rgba(15,23,42,0.10)"/>
    <circle cx="70" cy="70" r="42" stroke="url(#g)" stroke-width="10"/>
    <circle cx="98" cy="48" r="7" fill="#0B1220"/>
    <text x="0" y="178" font-family="Inter, system-ui, -apple-system" font-size="14" font-weight="600" fill="#0B1220">B) Ring + dot</text>
    <text x="0" y="198" font-family="Inter, system-ui, -apple-system" font-size="12" font-weight="500" fill="#5B667A">Feels “ops/control”</text>
  </g>

  <!-- Concept C: Snowflake-ish “C” made of arcs (clima) -->
  <g transform="translate(580,120)">
    <rect x="0" y="0" width="140" height="140" rx="44" fill="#FFFFFF" stroke="rgba(15,23,42,0.10)"/>
    <path d="M70 33 C52 33 37 48 37 66 C37 86 54 97 70 97 C86 97 103 86 103 66 C103 48 88 33 70 33 Z" fill="rgba(10,102,255,0.10)"/>
    <path d="M70 35 C54 35 41 48 41 64 C41 81 56 92 70 92 C84 92 99 81 99 64 C99 48 86 35 70 35 Z" stroke="#0B1220" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M45 103 C55 113 62 117 70 117 C78 117 85 113 95 103" stroke="rgba(0,184,148,0.9)" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="178" font-family="Inter, system-ui, -apple-system" font-size="14" font-weight="600" fill="#0B1220">C) “C” mark</text>
    <text x="0" y="198" font-family="Inter, system-ui, -apple-system" font-size="12" font-weight="500" fill="#5B667A">Clima + clean tech</text>
  </g>

  <!-- Concept D: Wordmark preview -->
  <g transform="translate(840,142)">
    <text x="0" y="36" font-family="Inter, system-ui, -apple-system" font-size="44" font-weight="900" fill="#0B1220" letter-spacing="-1.4">Clima</text>
    <text x="156" y="36" font-family="Inter, system-ui, -apple-system" font-size="44" font-weight="900" fill="url(#g)" letter-spacing="-1.4">Ops</text>
    <text x="0" y="64" font-family="Inter, system-ui, -apple-system" font-size="14" font-weight="600" fill="#5B667A">D) Wordmark (for header)</text>
  </g>

</svg>
